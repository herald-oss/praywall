version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: praywall-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: praywall
      POSTGRES_PASSWORD: praywall_dev
      POSTGRES_DB: praywall
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U praywall"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
